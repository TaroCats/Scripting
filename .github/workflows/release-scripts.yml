name: Release Scripts

# scripts/ 下有项目更新时自动：
#   1. 识别被改动的脚本项目
#   2. 递增该项目 script.json 的 version（默认 patch，可用提交信息里的 [minor] / [major] 覆盖）
#      并写入 remoteResource.url（源码目录 tree 地址）与 autoUpdateInterval
#   3. 打包出 <slug>.scripting 与 <slug>.zip（slug 为 ASCII，见 .github/release.config.json）
#   4. 提交版本号变更，并把产物覆盖上传到固定标签 <slug> 的 Release
#      远程更新地址（remoteResource.url）固定为源码目录：
#      https://github.com/<owner>/<repo>/tree/main/scripts/<项目名>
#      （与天气与行程的既有约定一致，Release 附件不再作为更新源）

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
  workflow_dispatch:
    inputs:
      project:
        description: 只发布指定项目（scripts 下的目录名），留空表示发布全部项目
        required: false
        type: string
      bump:
        description: 版本号递增方式
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-scripts
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检测变更的脚本项目
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          projects_file="$RUNNER_TEMP/projects.txt"
          : > "$projects_file"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_PROJECT:-}" ]; then
              printf '%s\n' "$INPUT_PROJECT" > "$projects_file"
            else
              for dir in scripts/*/; do
                [ -d "$dir" ] || continue
                basename "$dir"
              done | sort > "$projects_file"
            fi
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "${AFTER_SHA}^" 2>/dev/null || true)"
            fi
            if [ -n "$base" ]; then
              changed="$(git -c core.quotePath=false diff --name-only "$base" "$AFTER_SHA" -- scripts || true)"
            else
              changed="$(git -c core.quotePath=false ls-files scripts)"
            fi
            printf '%s\n' "$changed" | awk -F/ 'NF > 1 && $1 == "scripts" { print $2 }' | sort -u > "$projects_file"
          fi

          # 只保留真正包含 script.json 的项目目录
          filtered="$RUNNER_TEMP/projects.filtered.txt"
          : > "$filtered"
          while IFS= read -r project; do
            [ -n "$project" ] || continue
            if [ -f "scripts/$project/script.json" ]; then
              printf '%s\n' "$project" >> "$filtered"
            else
              echo "跳过 scripts/${project}：缺少 script.json"
            fi
          done < "$projects_file"
          mv "$filtered" "$projects_file"

          count="$(wc -l < "$projects_file" | tr -d '[:space:]')"
          echo "待发布项目：$count 个"
          cat "$projects_file"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: 递增版本号并打包
        if: steps.detect.outputs.count != '0'
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          bump="${BUMP_INPUT:-patch}"
          if [ "$EVENT_NAME" = "push" ]; then
            case "$HEAD_MESSAGE" in
              *"[major]"*) bump=major ;;
              *"[minor]"*) bump=minor ;;
            esac
          fi
          echo "版本号递增方式：$bump"

          versions_file="$RUNNER_TEMP/versions.tsv"
          : > "$versions_file"
          mkdir -p dist

          while IFS= read -r project; do
            [ -n "$project" ] || continue
            script_json="scripts/$project/script.json"

            # slug 必须是 ASCII：Release 附件名会被 GitHub 规范化，中文名会变成 default.xxx
            slug="$(node -e '
              const fs = require("fs");
              const project = process.argv.at(-1);
              const config = fs.existsSync(".github/release.config.json")
                ? JSON.parse(fs.readFileSync(".github/release.config.json", "utf8"))
                : {};
              const mapped = (config.projects || {})[project];
              const fallback = /^[a-z0-9][a-z0-9._-]*$/.test(project) ? project : "";
              const slug = mapped || fallback;
              if (!slug) {
                console.error(`「${project}」缺少 slug，请在 .github/release.config.json 的 projects 中补充`);
                process.exit(1);
              }
              if (!/^[a-z0-9][a-z0-9._-]*$/.test(slug)) {
                console.error(`「${project}」的 slug 只能包含小写字母、数字、点、下划线和连字符：${slug}`);
                process.exit(1);
              }
              process.stdout.write(slug);
            ' "$project")"

            current="$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.argv.at(-1),"utf8"));process.stdout.write(String(j.version??""))' "$script_json")"
            next="$(node -e 'const cur=process.argv.at(-2)||"";const type=process.argv.at(-1);const m=/^(\d+)\.(\d+)\.(\d+)/.exec(cur);let major=0,minor=0,patch=0;if(m){major=+m[1];minor=+m[2];patch=+m[3]}if(type==="major"){major+=1;minor=0;patch=0}else if(type==="minor"){minor+=1;patch=0}else{patch+=1}process.stdout.write(`${major}.${minor}.${patch}`)' "$current" "$bump")"
            remote_url="https://github.com/${GITHUB_REPOSITORY}/tree/main/scripts/$(node -e 'process.stdout.write(encodeURIComponent(process.argv.at(-1)))' "$project")"

            # 写入 version 与 remoteResource（源码目录 tree 地址；hash 由 App 维护，URL 变化时清掉旧值）
            node -e '
              const fs = require("fs");
              const file = process.argv.at(-3);
              const version = process.argv.at(-2);
              const url = process.argv.at(-1);
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = version;
              const previous = json.remoteResource && typeof json.remoteResource === "object" ? json.remoteResource : {};
              const remoteResource = Object.assign({}, previous, { url: url });
              if (!Object.prototype.hasOwnProperty.call(previous, "autoUpdateInterval")) {
                remoteResource.autoUpdateInterval = 3600;
              }
              if (previous.url !== url) {
                delete remoteResource.hash;
              }
              json.remoteResource = remoteResource;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            ' "$script_json" "$next" "$remote_url"

            base="dist/$slug"
            rm -rf "$base"
            mkdir -p "$base"
            # .scripting 与 .zip 内容一致：项目根目录下的文件直接位于压缩包根层
            (
              cd "scripts/$project"
              zip -r -X -q "$GITHUB_WORKSPACE/$base/$slug.scripting" . -x '.DS_Store' '*/.DS_Store' '__MACOSX/*'
            )
            cp "$base/$slug.scripting" "$base/$slug.zip"

            printf '%s\t%s\t%s\n' "$project" "$slug" "$next" >> "$versions_file"
            echo "已打包 dist/${slug}/${slug}.scripting（${project} ${current} -> ${next}）"
          done < "$RUNNER_TEMP/projects.txt"

          duplicates="$(cut -f2 "$versions_file" | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "slug 重复：$duplicates" >&2
            exit 1
          fi

      - name: 提交版本号变更
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'scripts/*/script.json'
          if git diff --cached --quiet; then
            echo "script.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(release): 更新脚本版本号 [skip ci]"
          git push || { git pull --rebase --autostash && git push; }

      - name: 发布到 Releases
        if: steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r project slug version; do
            [ -n "$project" ] || continue
            # 固定标签：每次覆盖同一 Release 的附件，下载地址长期不变
            tag="$slug"
            base="dist/$slug"
            notes="$base/notes.md"
            # 远程更新地址（与 remoteResource.url 一致）：源码目录 tree
            tree_url="https://github.com/${REPO}/tree/main/scripts/$(node -e 'process.stdout.write(encodeURIComponent(process.argv.at(-1)))' "$project")"

            {
              echo "## ${project} v${version}"
              echo
              echo "- 安装：把下面的固定地址填进脚本的「远程来源」，App 自动拉取并支持更新："
              echo "  \`${tree_url}\`"
              echo "- 也可以下载附件 \`${slug}.scripting\` 手动导入（不走自动更新）"
              echo "- 当前版本：\`${version}\`"
              echo "- 构建自 \`${AFTER_SHA:0:7}\`"
            } > "$notes"

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$base/$slug.scripting" "$base/$slug.zip" --clobber
              gh release edit "$tag" --title "${project} v${version}" --notes-file "$notes"
            else
              gh release create "$tag" "$base/$slug.scripting" "$base/$slug.zip" \
                --title "${project} v${version}" \
                --notes-file "$notes" \
                --latest=false
            fi

            echo "- ${project} v${version} → ${tree_url}" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/versions.tsv"
